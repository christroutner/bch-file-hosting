# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# Any fields after the receive mode are passed to the agent CLI, e.g. --yolo.
#
# Four roles on one harness (pi), same model as psf-memo.
# Check available model ids with: pi --list-models
window specifier pi master --model deepseek-v4.1-flash:cloud
window coder pi coder --model deepseek-v4.1-flash:cloud
window refactorer pi refactorer batch --model deepseek-v4.1-flash:cloud
window architect pi architect batch --model deepseek-v4.1-flash:cloud
